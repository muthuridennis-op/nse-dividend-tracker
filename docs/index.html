<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#2ca02c" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="NSE Dividends" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-512.png" />
  <link rel="icon" type="image/png" href="icon-512.png" />
  <title>NSE Dividend Tracker</title>
  <style>
    html, body {
      margin: 0; padding: 0; height: 100%;
      background: #0e1117; overflow: hidden;
    }
    iframe {
      border: 0; width: 100vw; height: 100vh; display: block;
    }
    #loader {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: #0e1117; color: #2ca02c;
      font-family: -apple-system, sans-serif; font-size: 18px;
      z-index: 10;
    }
  </style>
</head>
<body>
  <div id="loader">🇰🇪 Loading NSE Tracker…</div>
  <iframe id="app" src="" allow="clipboard-write"></iframe>

  <script src="config.js"></script>
  <script>
    const frame = document.getElementById("app");
    const sep = APP_URL.includes("?") ? "&" : "?";
    frame.src = APP_URL + sep + "embed=true";
    frame.onload = () => {
      document.getElementById("loader").style.display = "none";
    };
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("service-worker.js").catch(() => {});
    }
  </script>
</body>
</html>
